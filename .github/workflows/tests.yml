name: Automatisation des tests
on: push
jobs:
  Compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Compilation
        run: |
          last_directory=$(basename ${{ runner.workspace }})
          git clone https://github.com/${{ github.repository }}.git
          cd ./$last_directory
          mkdir build
          cd build
          cmake ..
          make
          make test

  Test_Add:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - name: Test fonction add
        run: |
          last_directory=$(basename ${{ runner.workspace }})
          git clone https://github.com/${{ github.repository }}.git
          cd ./$last_directory
          mkdir build
          cd build
          cmake ..
          make
          ./src/calculator add 10 5
  jobs:
  test-1:
    name: Test 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: <commande du test 1>

  test-2:
    name: Test 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: <commande du test 2>
